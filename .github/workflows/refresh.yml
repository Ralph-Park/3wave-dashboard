name: Refresh data

# 수치·주도주·뉴스를 모두 자동 갱신한다.
# 뉴스는 Google 이 러너 IP 를 차단할 수 있어 실패해도 워크플로를 깨뜨리지 않고
# 그때까지 수집된 분만 반영한다(fetch_news.py 가 지표마다 중간 저장한다).
on:
  schedule:
    # 명목 KST 월~금 02:00 (= UTC 일~목 17:00).
    # GitHub Actions 예약 실행은 부하에 따라 수시간 밀린다. 실측 지연이
    # 3시간 15분 수준(20:00 UTC 설정 → 23:15~23:18 UTC 실행)이라
    # 목표 시각(KST 05:00)보다 3시간 앞당겨 걸어 둔다.
    # cron 은 UTC 기준이므로 요일도 하루 당겨야 한다
    # (0 22 * * 1-5 로 두면 KST 화~토가 되어 월요일이 빠지고 토요일이 들어간다).
    - cron: "0 17 * * 0-4"
  workflow_dispatch:
    inputs:
      news:
        description: "뉴스도 갱신"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch macro data (FRED, 키 불필요)
        run: python3 fetch_data.py

      - name: Install libs for leader screening
        run: pip install --quiet yfinance pandas lxml requests

      - name: Fetch market leaders
        run: python3 fetch_leaders.py || echo "주도주 선정 실패 — 기존 leaders.json 유지"

      - name: Measure lead-lag
        run: python3 analyze_leadlag.py || echo "선행성 측정 실패 — 기존 leadlag.json 유지"

      # 스케줄 실행에서는 inputs 가 비어 있으므로 기본값을 true 로 해석한다
      - name: Fetch news
        if: ${{ github.event_name == 'schedule' || inputs.news }}
        env:
          RESOLVE_LIMIT: "0"
          REQUEST_GAP_SEC: "2.5"
          RETRY_BASE_SEC: "8"
        run: timeout 100m python3 fetch_news.py || echo "뉴스 수집 중단 — 수집된 분까지 저장됨"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json news.json leaders.json leadlag.json manual_inputs.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
